<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DompetKu — Pencatatan Keuangan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Firebase SDK v10 — Firestore & Realtime Database -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#f8fafc; --border:#e3e8f0;
  --text:#101828; --muted:#667085; --brand:#3b5bdb; --brand-soft:#e7edff;
  --green:#128a5b; --green-soft:#e2f6ed; --red:#d1453b; --red-soft:#fdeceb;
  --amber:#b5730c; --amber-soft:#fdf3e2; --purple:#7048c4; --purple-soft:#efe9fd;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
  --radius:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --surface:#161b24; --surface-2:#1c2230; --border:#2a3242;
    --text:#e8ecf3; --muted:#98a2b3; --brand:#7c9aff; --brand-soft:#1e2740;
    --green:#4ade80; --green-soft:#12291f; --red:#ff8079; --red-soft:#2d1917;
    --amber:#f0b95c; --amber-soft:#2b2211; --purple:#b69bff; --purple-soft:#241c3a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#161b24; --surface-2:#1c2230; --border:#2a3242;
  --text:#e8ecf3; --muted:#98a2b3; --brand:#7c9aff; --brand-soft:#1e2740;
  --green:#4ade80; --green-soft:#12291f; --red:#ff8079; --red-soft:#2d1917;
  --amber:#f0b95c; --amber-soft:#2b2211; --purple:#b69bff; --purple-soft:#241c3a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
img{max-width:100%}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hide{display:none !important}

/* ---------- AUTH ---------- */
#authView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:28px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.brand-logo{width:40px;height:40px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.brand h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.3px}
.brand p{margin:0;font-size:12.5px;color:var(--muted)}
.tabs-auth{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:4px;margin-bottom:20px}
.tabs-auth button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px;border-radius:8px;font-weight:600;font-size:14px}
.tabs-auth button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}

label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 6px}
.field{margin-bottom:14px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);outline:none;transition:.15s
}
input:focus,select:focus,textarea:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{resize:vertical;min-height:70px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;font-size:14px;background:var(--brand);color:#fff;transition:.15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn-block{width:100%}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn-danger{background:var(--red)}
.btn-sm{padding:7px 11px;font-size:12.5px;border-radius:8px}
.hint{font-size:12px;color:var(--muted);margin-top:14px;text-align:center;line-height:1.6}
.msg{font-size:13px;padding:9px 12px;border-radius:9px;margin-bottom:14px}
.msg.err{background:var(--red-soft);color:var(--red)}
.msg.ok{background:var(--green-soft);color:var(--green)}

/* ---------- APP SHELL & LAYOUT ---------- */
#appView {
  min-height: 100vh;
  display: flex;
  background: var(--bg);
  position: relative;
}

/* Sidebar Backdrop (Mobile Drawer) */
.sidebar-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(10, 15, 29, 0.6);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 85;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.sidebar-backdrop.active {
  opacity: 1;
  pointer-events: auto;
}

/* Sidebar Desktop */
.sidebar {
  width: 260px;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: 90;
  transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1), transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto;
  overflow-x: hidden;
}
.sidebar::-webkit-scrollbar {
  width: 4px;
}
.sidebar::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 4px;
}

/* Collapsed Sidebar (Desktop) */
.sidebar.collapsed {
  width: 78px;
}
.sidebar.collapsed .brand-text,
.sidebar.collapsed .sidebar-profile-info,
.sidebar.collapsed .nav-item-text,
.sidebar.collapsed .firebase-status-info,
.sidebar.collapsed .btn-text,
.sidebar.collapsed .sidebar-section-title {
  display: none !important;
}
.sidebar.collapsed .sidebar-header {
  padding: 16px 8px;
  justify-content: center;
}
.sidebar.collapsed .brand {
  justify-content: center;
  margin: 0;
}
.sidebar.collapsed .sidebar-profile {
  justify-content: center;
  padding: 10px 4px;
  margin: 10px 8px;
}
.sidebar.collapsed .nav-item {
  justify-content: center;
  padding: 12px 8px;
}
.sidebar.collapsed .firebase-badge-card {
  padding: 10px 4px;
  justify-content: center;
  margin: 10px 8px;
}
.sidebar.collapsed .sidebar-footer {
  padding: 12px 8px;
}
.sidebar.collapsed .sidebar-btn-action {
  justify-content: center;
  padding: 10px 8px;
}

/* Sidebar Components */
.sidebar-header {
  padding: 20px 18px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.sidebar-header .brand {
  margin: 0;
  display: flex;
  align-items: center;
  gap: 12px;
}
.sidebar-header .brand-logo {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--brand), #5c7cfa);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 19px;
  box-shadow: 0 4px 12px rgba(59, 91, 219, 0.3);
  flex-shrink: 0;
}
.sidebar-header .brand-text h1 {
  font-size: 17px;
  margin: 0;
  font-weight: 800;
  letter-spacing: -0.3px;
  line-height: 1.2;
}
.sidebar-header .brand-text p {
  margin: 2px 0 0;
  font-size: 11.5px;
  color: var(--muted);
  font-weight: 600;
}
.sidebar-close-mobile {
  display: none;
}

/* Profile snippet in sidebar */
.sidebar-profile {
  padding: 12px 14px;
  margin: 14px 14px 6px;
  border-radius: 12px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.sidebar-profile .avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--brand-soft);
  color: var(--brand);
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 14px;
  flex-shrink: 0;
}
.sidebar-profile-info {
  line-height: 1.25;
  min-width: 0;
  flex: 1;
}
.sidebar-profile-info b {
  font-size: 13.5px;
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sidebar-profile-info span {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
}

/* Sidebar Nav */
.sidebar-section-title {
  padding: 12px 18px 4px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  font-weight: 700;
  color: var(--muted);
}
.sidebar-nav {
  padding: 6px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
}
.nav-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: 10px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--muted);
  font-size: 13.5px;
  font-weight: 600;
  transition: all 0.18s ease;
  text-align: left;
}
.nav-item:hover {
  background: var(--surface-2);
  color: var(--text);
}
.nav-item.active {
  background: var(--brand-soft);
  border-color: rgba(59, 91, 219, 0.2);
  color: var(--brand);
  font-weight: 700;
}
:root[data-theme="dark"] .nav-item.active {
  border-color: rgba(124, 154, 255, 0.25);
}
.nav-item-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  flex-shrink: 0;
}
.nav-item-icon svg {
  width: 19px;
  height: 19px;
}
.nav-item-text {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Firebase Status Card */
.firebase-badge-card {
  margin: 10px 14px;
  padding: 11px 12px;
  border-radius: 12px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: all 0.18s ease;
}
.firebase-badge-card:hover {
  border-color: var(--brand);
  background: var(--brand-soft);
}
.firebase-status-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #f59e0b;
  flex-shrink: 0;
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
}
.firebase-status-dot.connected {
  background: #10b981;
  box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
}
.firebase-status-info {
  flex: 1;
  min-width: 0;
  line-height: 1.25;
}
.firebase-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.firebase-desc {
  font-size: 10.5px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.firebase-icon {
  font-size: 15px;
}

/* Sidebar Footer */
.sidebar-footer {
  padding: 12px 14px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.sidebar-btn-action {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 12px;
  border-radius: 9px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
  transition: 0.15s ease;
}
.sidebar-btn-action:hover {
  background: var(--surface-2);
  color: var(--text);
}
.sidebar-btn-action.text-danger:hover {
  background: var(--red-soft);
  color: var(--red);
}
.sidebar-btn-action .btn-icon {
  font-size: 15px;
}

/* App Content Wrapper */
.app-content-wrapper {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Topbar */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 40;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 20px;
}
.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.topbar-page-name {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.3px;
}
.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
}
.topbar-pill {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: 0.15s;
}
.topbar-pill:hover {
  background: var(--brand-soft);
  border-color: var(--brand);
  color: var(--brand);
}
.status-indicator-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #f59e0b;
}
.status-indicator-dot.connected {
  background: #10b981;
}

/* Bottom Tab Bar (Mobile) */
.bottom-tabbar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: calc(62px + env(safe-area-inset-bottom, 0px));
  padding: 4px 6px env(safe-area-inset-bottom, 0px);
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 50;
  box-shadow: 0 -4px 18px rgba(0, 0, 0, 0.05);
}
.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 6px 2px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 600;
  transition: all 0.15s ease;
  position: relative;
}
.tab-item:active {
  transform: scale(0.92);
}
.tab-item.active {
  color: var(--brand);
  font-weight: 700;
}
.tab-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  transition: transform 0.15s ease;
}
.tab-icon svg {
  width: 20px;
  height: 20px;
}
.tab-item.active .tab-icon {
  transform: translateY(-1px);
}
.tab-label {
  line-height: 1;
  white-space: nowrap;
}

main{flex:1;padding:20px 24px 60px;max-width:1120px;width:100%;margin:0 auto}
.page-title{font-size:20px;font-weight:800;letter-spacing:-.3px;margin:0 0 3px}
.page-sub{color:var(--muted);font-size:13.5px;margin:0 0 18px}

.grid{display:grid;gap:14px}
.cards{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.cols2{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 3px;font-size:15px;font-weight:700}
.card .desc{margin:0 0 14px;font-size:12.5px;color:var(--muted)}
.stat-label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px}
.stat-value{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-top:10px}
.stat-note{font-size:11.5px;color:var(--muted);margin-top:3px}

.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}

/* kategori chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:120px;position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:block;text-align:center;padding:10px 8px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--muted);transition:.15s;cursor:pointer}
.chip input:checked + span{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}

.dropzone{border:1.5px dashed var(--border);border-radius:11px;padding:16px;text-align:center;background:var(--surface-2);cursor:pointer;transition:.15s}
.dropzone:hover{border-color:var(--brand);background:var(--brand-soft)}
.dropzone b{display:block;font-size:13.5px}
.dropzone small{color:var(--muted);font-size:11.5px}
.preview{margin-top:10px;display:flex;align-items:center;gap:10px}
.preview img{width:56px;height:56px;object-fit:cover;border-radius:9px;border:1px solid var(--border)}

/* table */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
th{text-align:left;padding:11px 14px;background:var(--surface-2);color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.t-masuk{background:var(--green-soft);color:var(--green)}
.t-keluar{background:var(--red-soft);color:var(--red)}
.t-nabung{background:var(--purple-soft);color:var(--purple)}
.t-tarik{background:var(--amber-soft);color:var(--amber)}
.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.pos{color:var(--green)}.neg{color:var(--red)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:13.5px}
.thumb{width:34px;height:34px;border-radius:7px;object-fit:cover;border:1px solid var(--border);cursor:zoom-in;display:block}
.link-btn{background:none;border:0;color:var(--brand);font-weight:700;font-size:12.5px;padding:0;text-decoration:underline}

.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.filters select,.filters input{flex:1;min-width:140px;padding:9px 11px;font-size:13.5px}

/* chart */
.bar-row{display:grid;grid-template-columns:minmax(86px,1fr) 2.6fr auto;gap:10px;align-items:center;margin-bottom:11px;font-size:13px}
.bar-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bar-track{background:var(--surface-2);border-radius:999px;height:11px;overflow:hidden;border:1px solid var(--border)}
.bar-fill{height:100%;border-radius:999px;transition:width .5s ease}
.bar-val{font-variant-numeric:tabular-nums;font-weight:700;font-size:12.5px;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted)}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(9,12,20,.6);display:grid;place-items:center;padding:18px;z-index:100;overflow-y:auto}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;max-width:620px;width:100%;padding:20px;box-shadow:var(--shadow);max-height:88vh;overflow-y:auto}
.modal-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.modal-head h3{margin:0;font-size:17px;font-weight:800;flex:1}
.modal img{border-radius:10px;border:1px solid var(--border);display:block;margin:0 auto}

/* google */
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 16px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-weight:700;font-size:14px;transition:.15s}
.btn-google:hover{background:var(--surface-2);border-color:var(--muted)}
.btn-google svg{width:18px;height:18px;flex:none}
.pemisah{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--muted);font-size:12px;font-weight:600}

/* =====================================================

const KEY = "dompetku_v1";
const FIREBASE_KEY = "dompetku_firebase_cfg";
const KATEGORI = ["Kebutuhan pokok", "Kebutuhan kuliah", "Kebutuhan lainnya"];

let DB = { users: [], sesi: null };
let state = { page: "dashboard", bukti: null, filter: { tipe:"", kategori:"", cari:"" } };

/* Firebase State */
let firebaseApp = null;
let dbFirestore = null;

let isFirebaseConnected = false;
let firestoreUnsubscribe = null;

/* ICONS SVG Ringan & Modern */
const ICONS = {
  dashboard: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>`,
  saldo: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>`,

  nabung: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.5-1 2-2.5V8.5C20 6.5 20 5 19 5z"></path><circle cx="9" cy="12" r="1"></circle></svg>`,

};

/* Definisi Menu Pengguna & Admin */
const MENU_USER = [
  { id: "dashboard", label: "Dashboard", shortLabel: "Home", icon: ICONS.dashboard },
  { id: "saldo", label: "Masukkan Saldo", shortLabel: "Saldo", icon: ICONS.saldo },
  { id: "pengeluaran", label: "Pengeluaran", shortLabel: "Keluar", icon: ICONS.pengeluaran },
  { id: "nabung", label: "Nabung", shortLabel: "Nabung", icon: ICONS.nabung },
  { id: "riwayat", label: "Riwayat Transaksi", shortLabel: "Riwayat", icon: ICONS.riwayat }
];

const MENU_ADMIN = [
  { id: "dashboard", label: "Dashboard", shortLabel: "Home", icon: ICONS.dashboard },
  { id: "datauser", label: "Data User", shortLabel: "User", icon: ICONS.user },
  { id: "grafik", label: "Grafik Pengeluaran", shortLabel: "Grafik", icon: ICONS.grafik }
];

function muat(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) DB = JSON.parse(raw);
  }catch(e){ console.warn("Gagal membaca data:", e); }
  if(!DB.users) DB.users = [];
  if(!DB.users.some(u => u.role === "admin")){
    DB.users.push({ id:"adm-1", nama:"Administrator", email:"admin@dompetku.id", password:"admin123", role:"admin", transaksi:[], dibuat:Date.now() });
  }
  // Inisialisasi Firebase jika ada konfigurasi tersimpan
  const fCfg = muatFirebaseConfig();
  if(fCfg) initFirebase(fCfg);
}

function simpan(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ toast("Penyimpanan penuh — hapus beberapa bukti transaksi."); }
  // Otomatis sinkronkan ke Firebase Realtime Database jika terhubung
  syncKeRealtimeDb();
}
function uid(p){ return p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function userAktif(){ return DB.users.find(u => u.id === DB.sesi) || null; }

/* =====================================================
   HITUNGAN
===================================================== */
function ringkas(u){
  let masuk=0, keluar=0, nabung=0, tarik=0;
  (u.transaksi||[]).forEach(t=>{
    if(t.tipe==="masuk") masuk += t.nominal;
    else if(t.tipe==="keluar") keluar += t.nominal;
    else if(t.tipe==="nabung") nabung += t.nominal;
    else if(t.tipe==="tarik") tarik += t.nominal;
  });
  return {
    masuk, keluar,
    saldo: masuk - keluar - nabung + tarik,   // tabungan TIDAK dihitung pengeluaran
    tabungan: nabung - tarik,
    totalNabung: nabung,
    jumlah: (u.transaksi||[]).length
  };
}
function perKategori(u){
  const o = {}; KATEGORI.forEach(k => o[k]=0);
  (u.transaksi||[]).forEach(t=>{ if(t.tipe==="keluar" && o[t.kategori]!==undefined) o[t.kategori]+=t.nominal; });
  return o;
}
const rp = n => "Rp " + Math.round(n||0).toLocaleString("id-ID");
function formatRupiahInput(el){
  let val = el.value.replace(/\D/g, "");
  if(!val){ el.value = ""; return; }
  el.value = parseInt(val, 10).toLocaleString("id-ID");
}
function parseRupiahInput(val){
  if(typeof val === "number") return val;
  return parseInt(String(val||"").replace(/\D/g, ""), 10) || 0;
}
function tglHariIni(){
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}
function tglID(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"});
}
function esc(s){ return String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* =====================================================
   AUTH
===================================================== */
function switchAuth(mode){
  const l = mode==="login";
  tabLogin.classList.toggle("active", l); tabReg.classList.toggle("active", !l);
  formLogin.classList.toggle("hide", !l); formReg.classList.toggle("hide", l);
  authMsg.innerHTML = "";
}
function pesanAuth(txt, ok){ authMsg.innerHTML = '<div class="msg '+(ok?"ok":"err")+'">'+esc(txt)+'</div>'; }

function doRegister(e){
  e.preventDefault();
  const nama = rgNama.value.trim(), email = rgEmail.value.trim().toLowerCase(), pass = rgPass.value;
  if(DB.users.some(u => u.email === email)) return pesanAuth("Email sudah terdaftar.");
  DB.users.push({ id:uid("usr"), nama, email, password:pass, role:"user", transaksi:[], dibuat:Date.now() });
  simpan();
  formReg.reset(); switchAuth("login");
  pesanAuth("Akun berhasil dibuat. Silakan masuk.", true);
}
function doLogin(e){
  e.preventDefault();
  const email = lgEmail.value.trim().toLowerCase(), pass = lgPass.value;
  const akunGoogle = DB.users.find(x => x.email === email && !x.password);
  if(akunGoogle) return pesanAuth("Akun ini terdaftar lewat Google. Gunakan tombol \u201cMasuk dengan Google\u201d.");
  const u = DB.users.find(x => x.email === email && x.password === pass);
  if(!u) return pesanAuth("Email atau password salah.");
  DB.sesi = u.id; simpan();
  formLogin.reset(); authMsg.innerHTML = "";
  bukaApp();
}
/* ---- Masuk lewat Google ----
   Simulasi alur OAuth. Untuk produksi: muat https://accounts.google.com/gsi/client,
   kirim credential (JWT) ke backend, verifikasi di server, lalu buat sesi. */
function bukaGoogle(){
  const akun = DB.users.filter(u => u.provider === "google");
  const daftar = akun.map(u =>
    '<button type="button" class="akun-item" onclick="pilihAkunGoogle(\''+u.id+'\')">'
    + '<div class="avatar">'+esc(u.nama.trim().charAt(0).toUpperCase())+'</div>'
    + '<div style="flex:1;min-width:0"><b>'+esc(u.nama)+'</b><span>'+esc(u.email)+'</span></div>'
    + '<span style="color:var(--muted)">›</span></button>').join("");

  modalHost.innerHTML = '<div class="modal" onclick="if(event.target===this)tutupModal()"><div class="modal-box" style="max-width:400px">'
    + '<div class="modal-head">'
      + '<svg viewBox="0 0 48 48" style="width:26px;height:26px;flex:none;margin-top:2px" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.4 2.5 13.2l7.8 6.1C12.2 13.2 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.6-4.9 7.3l7.6 5.9c4.4-4.1 7.1-10.2 7.1-17.7z"/><path fill="#FBBC05" d="M10.3 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.5 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.8 2.3-8.3 2.3-6.4 0-11.8-3.7-13.7-9.9l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>'
      + '<div style="flex:1"><h3>Pilih akun</h3><p class="desc" style="margin:2px 0 0">untuk melanjutkan ke DompetKu</p></div>'
      + '<button class="icon-btn" onclick="tutupModal()">✕</button></div>'
    + daftar
    + '<form onsubmit="googleAkunBaru(event)" style="margin-top:'+(akun.length?"4px":"0")+'">'
      + '<div style="font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:10px">'+(akun.length?"Gunakan akun lain":"Masuk dengan akun Google kamu")+'</div>'
      + '<div class="field"><label>Nama lengkap</label><input type="text" id="gNama" placeholder="Budi Santoso" required></div>'
      + '<div class="field"><label>Alamat Gmail</label><input type="email" id="gEmail" placeholder="budi@gmail.com" required></div>'
      + '<button class="btn btn-block" type="submit">Lanjutkan</button>'
    + '</form>'
    + '<p class="hint" style="margin-top:14px">Demo alur Google Sign-In — tidak ada data yang dikirim keluar dari perangkat ini.</p>'
    + '</div></div>';
}
function pilihAkunGoogle(id){
  DB.sesi = id; simpan(); tutupModal(); bukaApp();
  toast("Masuk sebagai " + userAktif().nama);
}
function googleAkunBaru(e){
  e.preventDefault();
  const nama = gNama.value.trim(), email = gEmail.value.trim().toLowerCase();
  let u = DB.users.find(x => x.email === email);
  if(u){
    u.provider = "google";              // tautkan akun email lama ke Google
    if(nama) u.nama = nama;
  }else{
    u = { id:uid("usr"), nama, email, password:null, provider:"google", role:"user", transaksi:[], dibuat:Date.now() };
    DB.users.push(u);
  }
  DB.sesi = u.id; simpan(); tutupModal(); bukaApp();
  toast("Berhasil masuk dengan Google");
}

function muatFirebaseConfig(){
  try {
    const raw = localStorage.getItem(FIREBASE_KEY);
    return raw ? JSON.parse(raw) : DEFAULT_FIREBASE_CONFIG;
  } catch(e) { return DEFAULT_FIREBASE_CONFIG; }
}

function initFirebase(cfg){
  if(!cfg || !cfg.apiKey || (!cfg.projectId && !cfg.databaseURL)){
    isFirebaseConnected = false;
    updateFirebaseUI();
    return;
  }
  try {
    if(typeof firebase === "undefined"){
      console.warn("Firebase SDK belum selesai dimuat.");
      return;
    }
    if(!firebase.apps || !firebase.apps.length){
      firebaseApp = firebase.initializeApp(cfg);
    } else {
      firebaseApp = firebase.apps[0];
    }

    // Coba Firestore dulu jika projectId ada (Sesuai Firestore Console)
    if(cfg.projectId && firebase.firestore){
      try { dbFirestore = firebase.firestore(); } catch(e){ dbFirestore = null; }
    }

    // Coba Realtime Database jika databaseURL ada
    if(cfg.databaseURL && firebase.database){
      try { realtimeDb = firebase.database(); } catch(e){ realtimeDb = null; }
    }

    if(dbFirestore || realtimeDb){
      isFirebaseConnected = true;
      updateFirebaseUI();
      pasangRealtimeListener();
      const tipeDb = dbFirestore ? "Cloud Firestore" : "Realtime Database";
      toast("🔥 Firebase (" + tipeDb + ") terhubung!");
    } else {
      isFirebaseConnected = false;
      updateFirebaseUI();
    }
  } catch(err) {
    console.error("Gagal menginisialisasi Firebase:", err);
    isFirebaseConnected = false;
    updateFirebaseUI();
  }
}

}

/* ---- Realtime Listener: auto-sync saat data berubah di cloud ---- */
let _sedangMenulis = false; // flag pencegah loop sync

function pasangRealtimeListener(){
  // 1. Firestore listener (Utama)
  if(dbFirestore){
    if(firestoreUnsubscribe) firestoreUnsubscribe();
    firestoreUnsubscribe = dbFirestore.collection("dompetku").doc("app_data")
      .onSnapshot((doc) => {
        if(_sedangMenulis) return;
        if(doc.exists){
          gabungkanDataCloud(doc.data());
        }
      }, (err) => {
        console.warn("Firestore listener info:", err.message);
      });
  }

  // 2. Realtime Database listener (Opsional jika databaseURL diisi)
  if(realtimeDb){
    if(realtimeListener) realtimeDb.ref("dompetku").off("value", realtimeListener);
    realtimeListener = realtimeDb.ref("dompetku").on("value", (snapshot) => {
      if(_sedangMenulis) return;
      const data = snapshot.val();
      if(data) gabungkanDataCloud(data);
    }, (err) => {
      console.warn("Realtime DB listener info:", err.message);
    });
  }
}

function gabungkanDataCloud(data){
  if(!data || !data.users || !Array.isArray(data.users)) return;
  data.users.forEach(cu => {
    const idx = DB.users.findIndex(u => u.id === cu.id || u.email === cu.email);
    if(idx !== -1){
      if(cu.transaksi && cu.transaksi.length >= (DB.users[idx].transaksi||[]).length){
        DB.users[idx] = cu;
      }
    } else {
      DB.users.push(cu);
    }
  });
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e){}
  const u = userAktif();
  if(u && state.page) render();
}

/* ---- Tulis data ke Firebase (Firestore & Realtime DB) ---- */
function syncKeRealtimeDb(){
  if(!isFirebaseConnected) return;
  _sedangMenulis = true;
  const payload = {
    users: DB.users,
    terakhirUpdate: new Date().toISOString()
  };

  const janji = [];
  if(dbFirestore){
    janji.push(dbFirestore.collection("dompetku").doc("app_data").set(payload, { merge: true }));
  }
  if(realtimeDb){
    janji.push(realtimeDb.ref("dompetku").set(payload));
  }

  Promise.all(janji).then(() => {
    setTimeout(() => { _sedangMenulis = false; }, 500);
  }).catch((e) => {
    console.warn("Sync cloud error:", e);
    _sedangMenulis = false;
  });
}

function ekstrakConfigDariText(){
  const txt = document.getElementById("fbPasteSnippet").value;
  if(!txt.trim()) return toast("Silakan tempel kode config terlebih dahulu.");
  try {
    const ambil = (kunci) => {
      const regex = new RegExp(kunci + '\\s*:\\s*["\']([^"\']+)["\']');
      const match = txt.match(regex);
      return match ? match[1] : "";
    };
    const apiKey = ambil("apiKey");
    const projectId = ambil("projectId");
    const authDomain = ambil("authDomain");
    const storageBucket = ambil("storageBucket");
    const messagingSenderId = ambil("messagingSenderId");
    const appId = ambil("appId");
    const databaseURL = ambil("databaseURL");

    if(!apiKey) return toast("Gagal mendeteksi apiKey. Pastikan format snippet benar.");

    document.getElementById("fbApiKey").value = apiKey;
    if(projectId) document.getElementById("fbProjectId").value = projectId;
    if(authDomain) document.getElementById("fbAuthDomain").value = authDomain;
    if(storageBucket) document.getElementById("fbStorageBucket").value = storageBucket;
    if(messagingSenderId) document.getElementById("fbMessagingSenderId").value = messagingSenderId;
    if(appId) document.getElementById("fbAppId").value = appId;
    if(databaseURL) document.getElementById("fbDatabaseURL").value = databaseURL;

    toast("✅ Berhasil mengekstrak konfigurasi Firebase!");
  } catch(e){
    toast("Terjadi kesalahan parsing config.");
  }
}

function simpanFirebaseConfig(e){
  e.preventDefault();
  const cfg = {
    apiKey: document.getElementById("fbApiKey").value.trim(),
    projectId: document.getElementById("fbProjectId").value.trim(),
    authDomain: document.getElementById("fbAuthDomain").value.trim(),
    storageBucket: document.getElementById("fbStorageBucket").value.trim(),
    messagingSenderId: document.getElementById("fbMessagingSenderId").value.trim(),
    appId: document.getElementById("fbAppId").value.trim(),
    databaseURL: document.getElementById("fbDatabaseURL").value.trim()
  };

  if(!cfg.apiKey || (!cfg.projectId && !cfg.databaseURL)){
    return toast("API Key dan Project ID wajib diisi!");
  }

  localStorage.setItem(FIREBASE_KEY, JSON.stringify(cfg));
  location.reload();
}

function resetKeLokal(){
  if(!confirm("Kembali ke penyimpanan lokal? Firebase akan diputuskan.")) return;
  if(firestoreUnsubscribe){ firestoreUnsubscribe(); firestoreUnsubscribe = null; }
  if(realtimeDb && realtimeListener){ realtimeDb.ref("dompetku").off("value", realtimeListener); realtimeListener = null; }
  localStorage.removeItem(FIREBASE_KEY);
  isFirebaseConnected = false;
  firebaseApp = null;
  dbFirestore = null;
  realtimeDb = null;
  updateFirebaseUI();
  tutupModal();
  toast("Kembali ke penyimpanan lokal (offline).");
}

function bukaApp(){
  const u = userAktif(); if(!u) return logout();
  authView.classList.add("hide"); appView.classList.remove("hide");

  const menu = u.role === "admin" ? MENU_ADMIN : MENU_USER;
  if(!menu.some(m => m.id === state.page)){
    state.page = menu[0].id;
  }

  // Pulihkan status sidebar collapsed desktop
  if(localStorage.getItem("dompetku_sidebar_collapsed") === "1"){
    document.getElementById("sidebar")?.classList.add("collapsed");
  }

  renderNavigation();
  render();
}

function goto(p){
  state.page = p;
  toggleMobileSidebar(false);
  window.scrollTo({top:0, behavior:"smooth"});
  renderNavigation();
  render();
}

function render(){
  renderNavigation();
  const u = userAktif(); if(!u) return logout();
  const fn = u.role === "admin" ? viewAdmin : viewUser;
  main.innerHTML = fn(u, state.page);
  if(state.page === "riwayat") pasangFilter();
}

}

function toggleTheme(){

  + '<div class="grid cols2">'
  + '<div class="card"><form onsubmit="tambahPengeluaran(event)">'
    + '<div class="field"><label>Kategori</label><div class="chips">'
      + KATEGORI.map((k,i) => '<label class="chip"><input type="radio" name="kat" value="'+k+'" '+(i===0?"checked":"")+' onchange="cekLainnya()"><span>'+k.replace("Kebutuhan ","")+'</span></label>').join("")
    + '</div></div>'
    + '<div class="field hide" id="wrapLainnya"><label>Masukkan keterangan lainnya</label>'
      + '<input type="text" id="pLainnya" placeholder="Contoh: servis motor, kado teman"></div>'
    + '<div class="row"><div class="field"><label>Nominal (Rp)</label><input type="text" inputmode="numeric" id="pNominal" placeholder="50.000" required oninput="formatRupiahInput(this)"></div>'
      + '<div class="field"><label>Tanggal</label><input type="date" id="pTanggal" value="'+tgl+'" required></div></div>'
    + '<div class="field"><label>Keterangan (opsional)</label><textarea id="pKet" placeholder="Belanja bulanan di minimarket"></textarea></div>'
    + '<div class="field"><label>Upload bukti transaksi (opsional)</label>'
      + '<div class="dropzone" onclick="fileBukti.click()"><b>📎 Pilih gambar struk / bukti transfer</b><small>JPG atau PNG, otomatis dikompres</small></div>'
      + '<input type="file" id="fileBukti" accept="image/*" class="hide" onchange="pilihBukti(this)">'
      + '<div id="previewBukti"></div></div>'
    + '<button class="btn btn-block" type="submit">Simpan pengeluaran</button>'
  + '</form></div>'
  + '<div class="card"><h3>Sisa saldo</h3><p class="desc">Pengeluaran tidak boleh melebihi saldo.</p>'
    + '<div class="stat-value" style="color:'+(r.saldo>0?"var(--green)":"var(--red)")+'">'+rp(r.saldo)+'</div>'
    + '<div class="stat-note">Total pengeluaran sejauh ini: '+rp(r.keluar)+'</div>'
    + '<hr style="border:0;border-top:1px solid var(--border);margin:14px 0">'
    + '<h3 style="font-size:13.5px">Catatan</h3><p class="desc" style="margin:0">Uang yang dipindahkan ke tabungan dicatat terpisah dan <b>tidak</b> dihitung sebagai pengeluaran.</p></div>'
  + '</div>';
}
function cekLainnya(){
  const v = document.querySelector('input[name=kat]:checked').value;
  wrapLainnya.classList.toggle("hide", v !== "Kebutuhan lainnya");
}
function pilihBukti(input){
  const f = input.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const max = 700, skala = Math.min(1, max/Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*skala); c.height = Math.round(img.height*skala);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      state.bukti = c.toDataURL("image/jpeg", 0.6);
      previewBukti.innerHTML = '<div class="preview"><img src="'+state.bukti+'" alt="Pratinjau bukti">'
        + '<div style="flex:1"><div style="font-size:13px;font-weight:600">'+esc(f.name)+'</div>'
        + '<button type="button" class="link-btn" onclick="hapusBukti()">Hapus bukti</button></div></div>';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(f);
}
function hapusBukti(){ state.bukti = null; previewBukti.innerHTML = ""; fileBukti.value = ""; }

function tambahPengeluaran(e){
  e.preventDefault();
  const u = userAktif(), r = ringkas(u);
  if(!u) return toast("Sesi berakhir, silakan masuk kembali");
  const nominal = parseRupiahInput(pNominal.value);
  if(!nominal || nominal <= 0) return toast("Masukkan nominal yang valid");
  const kategori = document.querySelector('input[name=kat]:checked').value;
  if(nominal > r.saldo) return toast("Saldo tidak cukup. Sisa " + rp(r.saldo));
  let ket = pKet.value.trim() || kategori;
  if(kategori === "Kebutuhan lainnya" && pLainnya.value.trim()) ket = pLainnya.value.trim() + " — " + ket;
  const tgl = pTanggal.value || tglHariIni();
  u.transaksi.push({ id:uid("trx"), tipe:"keluar", nominal, tanggal:tgl, kategori, keterangan:ket, bukti:state.bukti });
  state.bukti = null; simpan(); toast("Pengeluaran tercatat"); goto("riwayat");
}

function halNabung(u){
  const r = ringkas(u);
  const tgl = tglHariIni();
  return '<h2 class="page-title">Nabung</h2><p class="page-sub">Saldo tabungan disimpan terpisah dan tidak dihitung sebagai pengeluaran.</p>'
  + '<div class="grid cards">'
    + kartuStat("🐷","var(--purple-soft)","var(--purple)","Saldo tabungan", rp(r.tabungan), "Total pernah ditabung: "+rp(r.totalNabung))
    + kartuStat("💰","var(--brand-soft)","var(--brand)","Saldo harian", rp(r.saldo), "Dana yang bisa dipakai")
  + '</div>'
  + '<div class="grid cols2" style="margin-top:14px">'
  + '<div class="card"><h3>Tabung uang</h3><p class="desc">Pindahkan dari saldo harian ke tabungan.</p><form onsubmit="tambahNabung(event)">'
    + '<div class="row"><div class="field"><label>Nominal (Rp)</label><input type="text" inputmode="numeric" id="nNominal" placeholder="200.000" required oninput="formatRupiahInput(this)"></div>'
    + '<div class="field"><label>Tanggal</label><input type="date" id="nTanggal" value="'+tgl+'" required></div></div>'
    + '<div class="field"><label>Tujuan menabung (opsional)</label><input type="text" id="nKet" placeholder="Dana darurat / beli laptop"></div>'
    + '<button class="btn btn-block" type="submit" style="background:var(--purple)">Tabung sekarang</button>'
  + '</form></div>'
  + '<div class="card"><h3>Tarik tabungan</h3><p class="desc">Kembalikan uang tabungan ke saldo harian.</p><form onsubmit="tarikNabung(event)">'
    + '<div class="row"><div class="field"><label>Nominal (Rp)</label><input type="text" inputmode="numeric" id="tNominal" placeholder="100.000" required oninput="formatRupiahInput(this)"></div>'
    + '<div class="field"><label>Tanggal</label><input type="date" id="tTanggal" value="'+tgl+'" required></div></div>'
    + '<div class="field"><label>Alasan penarikan (opsional)</label><input type="text" id="tKet" placeholder="Bayar UKT semester"></div>'
    + '<button class="btn btn-block btn-ghost" type="submit">Tarik tabungan</button>'
  + '</form></div></div>';
}
function tambahNabung(e){
  e.preventDefault();
  const u = userAktif(), r = ringkas(u);
  if(!u) return toast("Sesi berakhir, silakan masuk kembali");
  const n = parseRupiahInput(nNominal.value);
  if(!n || n <= 0) return toast("Masukkan nominal yang valid");
  if(n > r.saldo) return toast("Saldo harian tidak cukup. Sisa " + rp(r.saldo));
  const tgl = nTanggal.value || tglHariIni();
  const ket = nKet.value.trim() || "Tabungan";
  u.transaksi.push({ id:uid("trx"), tipe:"nabung", nominal:n, tanggal:tgl, kategori:"Tabungan", keterangan:ket, bukti:null });
  simpan(); toast("Berhasil menabung " + rp(n)); render();
}
function tarikNabung(e){
  e.preventDefault();
  const u = userAktif(), r = ringkas(u);
  if(!u) return toast("Sesi berakhir, silakan masuk kembali");
  const n = parseRupiahInput(tNominal.value);
  if(!n || n <= 0) return toast("Masukkan nominal yang valid");
  if(n > r.tabungan) return toast("Tabungan tidak cukup. Tersedia " + rp(r.tabungan));
  const tgl = tTanggal.value || tglHariIni();
  const ket = tKet.value.trim() || "Penarikan tabungan";
  u.transaksi.push({ id:uid("trx"), tipe:"tarik", nominal:n, tanggal:tgl, kategori:"Tabungan", keterangan:ket, bukti:null });
  simpan(); toast("Tabungan ditarik " + rp(n)); render();
}

const labelTipe = t => ({masuk:"Pemasukan",keluar:"Pengeluaran",nabung:"Nabung",tarik:"Tarik tabungan"}[t] || t);
const tagKelas  = t => ({masuk:"t-masuk",keluar:"t-keluar",nabung:"t-nabung",tarik:"t-tarik"}[t] || "");

function halRiwayat(u){
  const f = state.filter;
  let data = [...(u.transaksi||[])].sort((a,b)=> new Date(b.tanggal)-new Date(a.tanggal));
  if(f.tipe) data = data.filter(t => t.tipe === f.tipe);
  if(f.kategori) data = data.filter(t => t.kategori === f.kategori);
  if(f.cari) data = data.filter(t => (t.keterangan||"").toLowerCase().includes(f.cari.toLowerCase()));

  const baris = data.map(t =>
    '<tr><td style="white-space:nowrap">'+tglID(t.tanggal)+'</td>'
    + '<td><span class="tag '+tagKelas(t.tipe)+'">'+labelTipe(t.tipe)+'</span></td>'
    + '<td>'+esc(t.kategori)+'</td>'
    + '<td style="max-width:230px">'+esc(t.keterangan)+'</td>'
    + '<td class="num '+(t.tipe==="keluar"?"neg":t.tipe==="masuk"?"pos":"")+'">'+(t.tipe==="keluar"?"−":t.tipe==="masuk"?"+":"")+rp(t.nominal)+'</td>'
    + '<td>'+(t.bukti ? '<img src="'+t.bukti+'" class="thumb" onclick="lihatBukti(\''+t.id+'\')" alt="Bukti">' : '<span style="color:var(--muted)">—</span>')+'</td>'
    + '<td><button class="btn btn-sm btn-danger" onclick="hapusTrx(\''+t.id+'\')">Hapus</button></td></tr>').join("");

  return '<h2 class="page-title">Riwayat Transaksi</h2><p class="page-sub">'+data.length+' transaksi ditampilkan.</p>'
  + '<div class="filters">'
    + '<select id="fTipe"><option value="">Semua tipe</option>'
      + ["masuk","keluar","nabung","tarik"].map(t => '<option value="'+t+'" '+(f.tipe===t?"selected":"")+'>'+labelTipe(t)+'</option>').join("") + '</select>'
    + '<select id="fKat"><option value="">Semua kategori</option>'
      + KATEGORI.map(k => '<option value="'+k+'" '+(f.kategori===k?"selected":"")+'>'+k+'</option>').join("") + '</select>'
    + '<input type="text" id="fCari" placeholder="Cari keterangan…" value="'+esc(f.cari)+'">'
  + '</div>'
  + '<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Tipe</th><th>Kategori</th><th>Keterangan</th><th style="text-align:right">Nominal</th><th>Bukti</th><th>Aksi</th></tr></thead>'
  + '<tbody>'+ (baris || '<tr><td colspan="7" class="empty">Belum ada transaksi yang cocok.</td></tr>') +'</tbody></table></div>';
}
function pasangFilter(){
  fTipe.onchange = () => { state.filter.tipe = fTipe.value; render(); };
  fKat.onchange  = () => { state.filter.kategori = fKat.value; render(); };
  fCari.oninput  = () => { state.filter.cari = fCari.value; const p = fCari.selectionStart; render(); const el = document.getElementById("fCari"); el.focus(); el.setSelectionRange(p,p); };
}
function hapusTrx(id){
  const u = userAktif();
  if(!confirm("Hapus transaksi ini?")) return;
  u.transaksi = u.transaksi.filter(t => t.id !== id);
  simpan(); toast("Transaksi dihapus"); render();
}
function lihatBukti(id){
  let t = null;
  DB.users.forEach(u => (u.transaksi||[]).forEach(x => { if(x.id === id) t = x; }));
  if(!t) return;
  modalHost.innerHTML = '<div class="modal" onclick="if(event.target===this)tutupModal()"><div class="modal-box">'
    + '<div class="modal-head"><h3>Bukti transaksi</h3><button class="icon-btn" onclick="tutupModal()">✕</button></div>'
    + '<p class="desc">'+esc(t.keterangan)+' · '+tglID(t.tanggal)+' · '+rp(t.nominal)+'</p>'
    + '<img src="'+t.bukti+'" alt="Bukti transaksi"></div></div>';
}
function tutupModal(){ modalHost.innerHTML = ""; }

/* =====================================================
   HALAMAN ADMIN
===================================================== */
function viewAdmin(admin, page){
  if(page === "datauser") return adminDataUser();
  if(page === "grafik") return adminGrafik();
  return adminDashboard();
}
const daftarUser = () => DB.users.filter(u => u.role === "user");

function adminDashboard(){
  const us = daftarUser();
  let totKeluar=0, totSaldo=0, totNabung=0, totTrx=0;
  us.forEach(u => { const r = ringkas(u); totKeluar+=r.keluar; totSaldo+=r.saldo; totNabung+=r.tabungan; totTrx+=r.jumlah; });
  const kat = {}; KATEGORI.forEach(k => kat[k]=0);
  us.forEach(u => { const p = perKategori(u); KATEGORI.forEach(k => kat[k]+=p[k]); });
  const maxKat = Math.max(1, ...Object.values(kat));
  const teratas = us.map(u => ({ nama:u.nama, keluar:ringkas(u).keluar })).sort((a,b)=>b.keluar-a.keluar).slice(0,5);
  const maxU = Math.max(1, ...teratas.map(x=>x.keluar));

  return '<h2 class="page-title">Dashboard Admin</h2><p class="page-sub">Rekap seluruh pengguna terdaftar.</p>'
  + '<div class="grid cards">'
    + kartuStat("👥","var(--brand-soft)","var(--brand)","Total pengguna", us.length, "Tidak termasuk akun admin")
    + kartuStat("📉","var(--red-soft)","var(--red)","Total pengeluaran", rp(totKeluar), "Akumulasi semua pengguna")
    + kartuStat("🐷","var(--purple-soft)","var(--purple)","Total tabungan", rp(totNabung), "Dana tersimpan pengguna")
    + kartuStat("🧾","var(--green-soft)","var(--green)","Total transaksi", totTrx, "Sisa saldo gabungan "+rp(totSaldo))
  + '</div>'
  + '<div class="grid cols2" style="margin-top:14px">'
  + '<div class="card"><h3>Pengeluaran per kategori</h3><p class="desc">Gabungan seluruh pengguna.</p>'
    + KATEGORI.map(k => '<div class="bar-row"><div class="bar-name">'+k.replace("Kebutuhan ","")+'</div>'
      + '<div class="bar-track"><div class="bar-fill" style="width:'+(kat[k]/maxKat*100)+'%;background:'+WARNA[k]+'"></div></div>'
      + '<div class="bar-val">'+rp(kat[k])+'</div></div>').join("")
  + '</div>'
  + '<div class="card"><h3>5 pengguna paling boros</h3><p class="desc">Berdasarkan total pengeluaran.</p>'
    + (teratas.length ? teratas.map(x => '<div class="bar-row"><div class="bar-name">'+esc(x.nama)+'</div>'
      + '<div class="bar-track"><div class="bar-fill" style="width:'+(x.keluar/maxU*100)+'%;background:var(--brand)"></div></div>'
      + '<div class="bar-val">'+rp(x.keluar)+'</div></div>').join("") : '<p class="desc">Belum ada pengguna.</p>')
  + '</div></div>';
}

function adminDataUser(){
  const us = daftarUser();
  const baris = us.map(u => {
    const r = ringkas(u);
    const badge = u.provider === "google" ? '<span class="tag-google">Google</span>' : '';
    return '<tr><td><div style="font-weight:700">'+esc(u.nama)+badge+'</div><div style="font-size:11.5px;color:var(--muted)">'+esc(u.email)+'</div></td>'
    + '<td class="num">'+rp(r.saldo)+'</td>'
    + '<td class="num neg">'+rp(r.keluar)+'</td>'
    + '<td class="num" style="color:var(--purple)">'+rp(r.tabungan)+'</td>'
    + '<td class="num">'+r.jumlah+'</td>'
    + '<td style="white-space:nowrap"><button class="btn btn-sm btn-ghost" onclick="detailUser(\''+u.id+'\')">Detail</button> '
    + '<button class="btn btn-sm btn-danger" onclick="hapusUser(\''+u.id+'\')">Hapus</button></td></tr>';
  }).join("");

  return '<h2 class="page-title">Data User</h2><p class="page-sub">'+us.length+' pengguna terdaftar di sistem.</p>'
  + '<div class="table-wrap"><table><thead><tr><th>Pengguna</th><th style="text-align:right">Saldo</th><th style="text-align:right">Pengeluaran</th><th style="text-align:right">Tabungan</th><th style="text-align:right">Transaksi</th><th>Aksi</th></tr></thead>'
  + '<tbody>'+ (baris || '<tr><td colspan="6" class="empty">Belum ada pengguna yang mendaftar.</td></tr>') +'</tbody></table></div>';
}
function detailUser(id){
  const u = DB.users.find(x => x.id === id); if(!u) return;
  const r = ringkas(u);
  const rows = [...(u.transaksi||[])].sort((a,b)=> new Date(b.tanggal)-new Date(a.tanggal)).map(t =>
    '<tr><td style="white-space:nowrap">'+tglID(t.tanggal)+'</td><td><span class="tag '+tagKelas(t.tipe)+'">'+labelTipe(t.tipe)+'</span></td>'
    + '<td>'+esc(t.kategori)+'</td><td>'+esc(t.keterangan)+'</td><td class="num">'+rp(t.nominal)+'</td>'
    + '<td>'+(t.bukti ? '<img src="'+t.bukti+'" class="thumb" onclick="lihatBukti(\''+t.id+'\')" alt="Bukti">' : '—')+'</td></tr>').join("");

  modalHost.innerHTML = '<div class="modal" onclick="if(event.target===this)tutupModal()"><div class="modal-box">'
    + '<div class="modal-head"><h3>'+esc(u.nama)+'</h3><button class="icon-btn" onclick="tutupModal()">✕</button></div>'
    + '<p class="desc">'+esc(u.email)+' · Saldo '+rp(r.saldo)+' · Pengeluaran '+rp(r.keluar)+' · Tabungan '+rp(r.tabungan)+'</p>'
    + '<div class="table-wrap"><table style="min-width:520px"><thead><tr><th>Tanggal</th><th>Tipe</th><th>Kategori</th><th>Keterangan</th><th style="text-align:right">Nominal</th><th>Bukti</th></tr></thead>'
    + '<tbody>'+(rows || '<tr><td colspan="6" class="empty">Belum ada transaksi.</td></tr>')+'</tbody></table></div></div></div>';
}
function hapusUser(id){
  const u = DB.users.find(x => x.id === id);
  if(!confirm("Hapus akun "+u.nama+" beserta seluruh transaksinya?")) return;
  DB.users = DB.users.filter(x => x.id !== id);
  simpan(); toast("Pengguna dihapus"); render();
}

function adminGrafik(){
  const us = daftarUser();
  const data = us.map(u => ({ nama:u.nama, kat:perKategori(u), total:ringkas(u).keluar })).sort((a,b)=>b.total-a.total);
  const max = Math.max(1, ...data.map(d=>d.total));
  const W = 100; // persen

  const batang = data.map(d => {
    const seg = KATEGORI.map(k => d.kat[k] > 0
      ? '<div style="width:'+(d.kat[k]/max*W)+'%;background:'+WARNA[k]+'" title="'+k+': '+rp(d.kat[k])+'"></div>' : "").join("");
    return '<div class="bar-row"><div class="bar-name">'+esc(d.nama)+'</div>'
      + '<div class="bar-track" style="display:flex">'+seg+'</div>'
      + '<div class="bar-val">'+rp(d.total)+'</div></div>';
  }).join("");

  // total per kategori -> donat SVG
  const tot = {}; let grand = 0;
  KATEGORI.forEach(k => { tot[k] = data.reduce((s,d)=>s+d.kat[k],0); grand += tot[k]; });
  let mulai = 0, keliling = 2*Math.PI*54;
  const arc = KATEGORI.map(k => {
    const porsi = grand ? tot[k]/grand : 0;
    const el = '<circle cx="70" cy="70" r="54" fill="none" stroke="'+WARNA[k]+'" stroke-width="22"'
      + ' stroke-dasharray="'+(porsi*keliling)+' '+keliling+'" stroke-dashoffset="'+(-mulai*keliling)+'" transform="rotate(-90 70 70)"></circle>';
    mulai += porsi; return porsi > 0 ? el : "";
  }).join("");

  return '<h2 class="page-title">Grafik Pengeluaran User</h2><p class="page-sub">Pengeluaran tiap pengguna dipecah per kategori. Tabungan tidak dihitung.</p>'
  + '<div class="grid cols2">'
  + '<div class="card"><h3>Pengeluaran per pengguna</h3><p class="desc">Warna menunjukkan komposisi kategori.</p>'
    + (batang || '<p class="desc">Belum ada data.</p>')
    + '<div class="legend">'+KATEGORI.map(k => '<span><i style="background:'+WARNA[k]+'"></i>'+k+'</span>').join("")+'</div></div>'
  + '<div class="card"><h3>Komposisi kategori</h3><p class="desc">Total seluruh pengguna: '+rp(grand)+'</p>'
    + '<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">'
      + '<svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="Diagram komposisi pengeluaran">'
        + '<circle cx="70" cy="70" r="54" fill="none" stroke="var(--surface-2)" stroke-width="22"></circle>'+arc+'</svg>'
      + '<div style="flex:1;min-width:150px">'
        + KATEGORI.map(k => '<div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px">'
          + '<span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:'+WARNA[k]+';margin-right:7px"></i>'+k+'</span>'
          + '<b>'+(grand ? Math.round(tot[k]/grand*100) : 0)+'%</b></div>').join("")
      + '</div></div></div>'
  + '</div>';
}
